# Nightly database backup, checked by restoring it. The free Supabase plan has no backups of its own.
# Needs the repository secret SUPABASE_DB_URL: the session-pooler connection string
# in plain "postgresql://" form (not "postgresql+psycopg://").
# Keep this repository PRIVATE: backups contain the learner's study data.
#
# A backup nobody has restored is a hope, not a backup, so every night's dump is restored into a
# throwaway Postgres and verified (backend/app/restore_check.py). If it can't be restored, or comes
# back smaller than the live database, this job fails and GitHub emails you. The dump is kept
# either way. To restore for real, see docs/backup-and-restore.md.
name: Database backup

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC daily
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RESTORE_URL: postgresql://postgres:postgres@localhost:5432/restore
    services:
      # A throwaway database the dump is restored into. Same major version as Supabase.
      restore-target:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Backup is not set up
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: echo "SUPABASE_DB_URL is not set; skipping backup."

      - uses: actions/checkout@v4
        if: ${{ env.SUPABASE_DB_URL != '' }}

      - name: Dump database
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          DUMP="backup-$(date -u +%F).dump"
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"
          # pg_dump must be at least the server's major version (Supabase runs Postgres 17).
          docker run --rm -e SUPABASE_DB_URL postgres:17 \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --schema=public' \
            > "$DUMP"
          ls -l "$DUMP"

      - name: Restore it into a throwaway database
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          # --clean --if-exists replaces the empty "public" schema. Errors are printed but don't stop
          # here: the check below decides whether what came back is usable.
          docker run --rm --network host -v "$PWD":/backup postgres:17 \
            pg_restore --clean --if-exists --no-owner --dbname="$RESTORE_URL" "/backup/$DUMP" \
            || echo "pg_restore reported errors (above); verifying what was restored."

      - uses: actions/setup-python@v5
        if: ${{ env.SUPABASE_DB_URL != '' }}
        with:
          python-version: "3.13"

      - name: Verify the restored database
        if: ${{ env.SUPABASE_DB_URL != '' }}
        working-directory: backend
        run: |
          pip install uv==0.13.7
          uv sync --locked
          uv run python -m app.restore_check "$RESTORE_URL" --compare "$SUPABASE_DB_URL"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.SUPABASE_DB_URL != '' }}
        with:
          name: db-backup
          path: backup-*.dump
          retention-days: 30
          if-no-files-found: ignore
